<section id="hero" class="relative h-screen flex items-center justify-center overflow-hidden bg-brand-bg">
  <!-- Background Image Overlay -->
  <div class="absolute inset-0 z-0">
    <img 
      src="assets/images/hero/hero-bg.png" 
      alt="Render 3D de alta qualidade de um interior moderno"
      class="w-full h-full object-cover opacity-40 scale-105"
      loading="eager"
    />
    <div class="absolute inset-0 bg-gradient-to-b from-brand-bg/60 via-transparent to-brand-bg"></div>
  </div>

  <div class="container mx-auto px-6 relative z-10 text-center">
    <h1 class="text-4xl md:text-7xl font-light tracking-tighter text-brand-text mb-6">
      Não entregamos apenas imagens.<br>
      <span class="text-brand-accent font-medium">Entregamos a realidade.</span>
    </h1>
    
    <p class="text-lg md:text-xl text-brand-muted max-w-2xl mx-auto mb-12 leading-relaxed">
      Transformamos seus projetos arquitetônicos em experiências visuais imersivas que emocionam e vendem.
    </p>

    <div class="flex flex-col md:flex-row gap-6 justify-center items-center">
      <button 
        (click)="scrollTo('contato')"
        class="bg-brand-accent text-brand-bg px-10 py-4 text-sm font-bold uppercase tracking-widest hover:bg-white transition-all duration-300 w-full md:w-auto rounded-full shadow-lg shadow-brand-accent/20"
      >
        Solicitar Orçamento
      </button>
      <button 
        (click)="scrollTo('portfolio')"
        class="border border-brand-text/30 text-brand-text px-10 py-4 text-sm font-bold uppercase tracking-widest hover:border-brand-accent hover:text-brand-accent transition-all duration-300 w-full md:w-auto rounded-full"
      >
        Ver Portfólio
      </button>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-50 animate-bounce cursor-pointer" (click)="scrollTo('problema')">
    <span class="text-[10px] uppercase tracking-[0.3em] text-brand-muted">Descubra</span>
    <i class="pi pi-chevron-down text-brand-accent"></i>
  </div>
</section>
