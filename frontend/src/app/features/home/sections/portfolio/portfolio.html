<section id="portfolio" class="py-32 bg-brand-bg">
  <div class="container mx-auto px-6">
    <app-section-title 
      title="Portfólio" 
      subtitle="Excelência em cada pixel."
      class="mb-12 text-center"
    ></app-section-title>
      
    <!-- Filters -->
    <div class="flex flex-wrap justify-center gap-4 md:gap-8 mb-16">
      <button 
        *ngFor="let cat of categories"
        (click)="setFilter(cat)"
        [class.text-brand-accent]="activeFilter() === cat"
        [class.border-brand-accent]="activeFilter() === cat"
        class="text-[10px] md:text-xs uppercase tracking-[0.2em] py-2 border-b-2 border-transparent hover:text-brand-accent transition-all duration-300"
      >
        {{ cat }}
      </button>
    </div>

    <!-- Organic Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-6 auto-rows-[250px]">
      <div 
        *ngFor="let item of filteredItems(); let i = index"
        (click)="openLightbox(item)"
        [ngClass]="{
          'lg:col-span-3 lg:row-span-2': i % 6 === 0,
          'lg:col-span-3 lg:row-span-1': i % 6 === 1,
          'lg:col-span-2 lg:row-span-2': i % 6 === 2,
          'lg:col-span-4 lg:row-span-2': i % 6 === 3,
          'lg:col-span-2 lg:row-span-1': i % 6 === 4,
          'lg:col-span-4 lg:row-span-1': i % 6 === 5
        }"
        class="relative overflow-hidden cursor-pointer group bg-brand-surface border border-white/5 rounded-2xl shadow-xl transition-all duration-500 hover:z-10 hover:shadow-brand-accent/20"
      >
        <img 
          [src]="item.thumb" 
          [alt]="item.title"
          class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-70 group-hover:opacity-100"
          loading="lazy"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-brand-bg/90 via-brand-bg/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8">
          <span class="text-brand-accent text-[10px] uppercase tracking-widest mb-2">{{ item.category }}</span>
          <h3 class="text-brand-text text-xl font-light tracking-tight">{{ item.title }}</h3>
          
          <div class="mt-4 h-0.5 w-0 group-hover:w-12 bg-brand-accent transition-all duration-500 delay-100"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div 
    *ngIf="selectedImage() as item"
    class="fixed inset-0 z-[1000] bg-brand-bg/95 flex items-center justify-center p-4 md:p-12 animate-in fade-in duration-300"
    (click)="closeLightbox()"
  >
    <button class="absolute top-8 right-8 text-brand-text text-4xl hover:text-brand-accent transition-colors">
      <i class="pi pi-times"></i>
    </button>
    
    <div class="relative max-w-6xl w-full h-full flex flex-col items-center justify-center" (click)="$event.stopPropagation()">
      <img 
        [src]="item.src" 
        [alt]="item.title"
        class="max-w-full max-h-[80vh] object-contain shadow-2xl"
      />
      <div class="mt-8 text-center">
        <span class="text-brand-accent text-xs uppercase tracking-[0.3em] mb-2 block font-bold">{{ item.category }}</span>
        <h4 class="text-brand-text text-2xl font-light tracking-tight">{{ item.title }}</h4>
      </div>
    </div>
  </div>
</section>
